<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voicelab Login</title>
<style>
@font-face{font-family:"Figtree";font-weight:500;font-display:block;src:url(assets/fonts/figtree-500.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:block;src:url(assets/fonts/figtree-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:block;src:url(assets/fonts/figtree-700.woff2) format("woff2")}
@font-face{font-family:"PwDot";src:url(assets/fonts/pwdot.woff2) format("woff2")}
@font-face{font-family:"Red Hat Display";font-weight:400;font-display:block;src:url(assets/fonts/red-hat-display-400.woff2) format("woff2")}
@font-face{font-family:"Red Hat Display";font-weight:600;font-display:block;src:url(assets/fonts/red-hat-display-600.woff2) format("woff2")}
@font-face{font-family:"Red Hat Display";font-weight:700;font-display:block;src:url(assets/fonts/red-hat-display-700.woff2) format("woff2")}
@font-face{font-family:"Red Hat Display";font-weight:500;font-display:block;src:url(assets/fonts/red-hat-display-500.woff2) format("woff2")}

/* ------------------------------------------------------------------
   Scale system
   The reference artboard is 2048 x 1389. Every measurement below is a
   reference pixel multiplied by --u, so at the reference aspect ratio
   the page is a 1:1 reproduction, and on any other viewport the layout
   stays full-bleed (no letterboxing): columns stretch, content scales.
   ------------------------------------------------------------------ */
:root{
  --u: min(100vw / 2048, 100dvh / 1389);
  --ink:#0b0c14;
  --ink-2:#26282c;
  --ink-3:#3b3d42;
  --line:#dedfe2;
  --brand:#7b4ff2;
  --brand-ink:#6a3fe4;
  --page:#ffffff;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  font-family:"Figtree",system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
svg{display:block}

.screen{position:relative;width:100vw;height:100dvh;min-height:calc(var(--u)*1389)}

/* ---------------- LEFT COLUMN ---------------- */
.left{position:absolute;inset:0 50% 0 0}
.brand{position:absolute;left:calc(var(--u)*68);top:calc(var(--u)*75);display:flex;align-items:center;gap:calc(var(--u)*17);text-decoration:none}
.brand-mark{width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:calc(var(--u)*10);
  background:linear-gradient(135deg,#8c64fb 0%,#7a52f6 55%,#6d45ee 100%);
  display:grid;place-items:center;box-shadow:inset 0 0 0 calc(var(--u)*1) rgba(255,255,255,.14)}
.brand-mark svg{width:calc(var(--u)*30);height:calc(var(--u)*30)}
.brand-name{font-weight:700;font-size:calc(var(--u)*31.4);letter-spacing:calc(var(--u)*-.2);color:var(--brand-ink);line-height:1}

.form-wrap{position:absolute;left:calc(46.484% - var(--u)*303);top:calc(50% - var(--u)*414.5);width:calc(var(--u)*606)}
.title{font-weight:700;font-size:calc(var(--u)*58.5);line-height:1;letter-spacing:calc(var(--u)*-.6);text-align:center;color:var(--ink);white-space:nowrap}
.subtitle{margin-top:calc(var(--u)*19);font-weight:500;font-size:calc(var(--u)*23.2);line-height:1.3;text-align:center;color:var(--ink-2);white-space:nowrap}

.field{display:block}
.field + .field{margin-top:calc(var(--u)*36)}
.fields{margin-top:calc(var(--u)*92)}
.label{display:block;font-weight:500;font-size:calc(var(--u)*19);line-height:1;color:var(--ink-3);margin-bottom:calc(var(--u)*13)}
.input{position:relative;height:calc(var(--u)*60);border:calc(var(--u)*2) solid var(--line);border-radius:calc(var(--u)*11);background:#fff;display:flex;align-items:center;transition:border-color .15s, box-shadow .15s}
.input.pw{height:calc(var(--u)*55)}
.input:focus-within{border-color:#b9a3fb;box-shadow:0 0 0 calc(var(--u)*4) rgba(123,79,242,.12)}
.input input{width:100%;height:100%;padding:0 calc(var(--u)*19);font-weight:500;font-size:calc(var(--u)*18.7);color:#0e0f12}
.input.pw input{font-family:"PwDot","Figtree",sans-serif;font-size:calc(var(--u)*32);letter-spacing:calc(var(--u)*3.1);padding-left:calc(var(--u)*15);padding-bottom:calc(var(--u)*5)}
.input.pw input.shown{font-size:calc(var(--u)*18.7);letter-spacing:0;font-family:"Figtree",sans-serif;padding-right:calc(var(--u)*60)}
.eye{position:absolute;right:calc(var(--u)*18);top:50%;transform:translateY(-50%);width:calc(var(--u)*19.5);height:calc(var(--u)*21);display:grid;place-items:center}
.eye svg{width:100%;height:100%}
.forgot{display:block;margin-top:calc(var(--u)*11);text-align:right;font-weight:500;font-size:calc(var(--u)*18.7);line-height:1.2;color:#111316;text-decoration:none}

.btn-primary{display:block;width:100%;height:calc(var(--u)*83);margin-top:calc(var(--u)*46);padding-bottom:calc(var(--u)*4);border-radius:calc(var(--u)*15);
  background:linear-gradient(180deg,#9676f8 0%,#8a68f7 45%,#7d57f4 100%);
  color:#fff;font-weight:600;font-size:calc(var(--u)*25.5);letter-spacing:calc(var(--u)*.1);
  box-shadow:inset 0 calc(var(--u)*1.5) 0 rgba(255,255,255,.18), 0 calc(var(--u)*4) calc(var(--u)*14) rgba(123,79,242,.18);
  transition:filter .15s, transform .15s}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{transform:translateY(calc(var(--u)*1))}

.divider{display:flex;align-items:center;gap:calc(var(--u)*23);margin-top:calc(var(--u)*34);font-weight:500;font-size:calc(var(--u)*22.7);color:#0d0e10;line-height:1}
.divider::before,.divider::after{content:"";flex:1;height:calc(var(--u)*2.5);background:#e6e6e8;position:relative;top:calc(var(--u)*2)}

.btn-social{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*14);width:100%;height:calc(var(--u)*74);border:calc(var(--u)*2) solid #e3e3e5;border-radius:calc(var(--u)*11);background:#fafafa;font-weight:600;font-size:calc(var(--u)*23.2);color:#0c0d10;transition:background .15s}
.btn-social:hover{background:#f3f3f5}
.btn-social svg{width:calc(var(--u)*29);height:calc(var(--u)*29);position:relative}
.btn-social{padding-top:calc(var(--u)*4)}
.btn-social.g svg{top:calc(var(--u)*-3)}
.btn-social.g{margin-top:calc(var(--u)*39)}
.btn-social.a{margin-top:calc(var(--u)*17);padding-left:calc(var(--u)*4)}
.btn-social.a svg{width:calc(var(--u)*26);height:calc(var(--u)*30);top:calc(var(--u)*-3)}
.signup{margin-top:calc(var(--u)*44);text-align:center;font-weight:500;font-size:calc(var(--u)*23.7);color:#0d0e10;line-height:1.2}
.signup a{color:#7449ef;text-decoration:underline;text-decoration-thickness:calc(var(--u)*1.5);text-underline-offset:calc(var(--u)*5)}

.foot{position:absolute;left:calc(var(--u)*70);right:calc(var(--u)*69);bottom:calc(var(--u)*53);display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:calc(var(--u)*22.8);color:#25272b;line-height:1}
.foot span{display:flex;align-items:center;gap:calc(var(--u)*10)}
.foot svg{width:calc(var(--u)*25);height:calc(var(--u)*25)}
.foot a{color:#26282c;text-decoration:none}

/* ---------------- RIGHT PANEL ---------------- */
.panel{position:absolute;left:50%;right:calc(var(--u)*12);top:calc(var(--u)*11);bottom:calc(var(--u)*12);
  border-radius:calc(var(--u)*22);overflow:hidden;isolation:isolate;
  background:#0a0e3a url(assets/images/ai-builder-bg.webp) center/cover no-repeat;
  font-family:"Red Hat Display",sans-serif;color:#fff}
.panel-inner{position:absolute;left:0;right:0;bottom:calc(var(--u)*63);display:flex;flex-direction:column;align-items:center}
.ask{font-family:"Figtree",sans-serif;font-weight:700;font-size:calc(var(--u)*57.2);line-height:1;letter-spacing:calc(var(--u)*-.6);white-space:nowrap;margin-right:calc(var(--u)*39);color:#fff;text-shadow:0 calc(var(--u)*2) calc(var(--u)*18) rgba(0,0,20,.25)}
.chips{display:flex;gap:calc(var(--u)*17);margin-top:calc(var(--u)*35);margin-right:calc(var(--u)*39);justify-content:center}
.chip{display:flex;align-items:center;gap:calc(var(--u)*14);height:calc(var(--u)*46);padding:0 0 0 calc(var(--u)*9.5);border-radius:999px;
  background:linear-gradient(180deg,rgba(78,80,100,.34),rgba(66,68,88,.26));
  border:calc(var(--u)*2) solid rgba(255,255,255,.24);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.08), 0 calc(var(--u)*4) calc(var(--u)*14) rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(calc(var(--u)*12));backdrop-filter:blur(calc(var(--u)*12));
  font-weight:600;font-size:calc(var(--u)*17.1);color:#f4f4fa;white-space:nowrap;transition:background .15s, border-color .15s}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.chip:nth-child(1){width:calc(var(--u)*164)}.chip:nth-child(2){width:calc(var(--u)*177)}.chip:nth-child(3){width:calc(var(--u)*182)}.chip:nth-child(4){width:calc(var(--u)*198)}
.chip i{flex:none;width:calc(var(--u)*27);height:calc(var(--u)*27);border-radius:50%;background:#fff;display:grid;place-items:center}
.chip i svg{width:calc(var(--u)*17);height:calc(var(--u)*17)}

.prompt{position:relative;margin-top:calc(var(--u)*68);width:min(calc(var(--u)*886), calc(100% - var(--u)*126));height:calc(var(--u)*332);border-radius:calc(var(--u)*32);
  background:
    linear-gradient(90deg, rgba(70,70,92,.30) 0%, rgba(70,70,92,0) 30%),
    linear-gradient(180deg, rgba(40,40,62,.66) 0%, rgba(42,42,66,.60) 60%, rgba(48,48,64,.60) 100%);
  -webkit-backdrop-filter:blur(calc(var(--u)*22)) saturate(1.2);backdrop-filter:blur(calc(var(--u)*22)) saturate(1.2);
  box-shadow:
    inset 0 0 calc(var(--u)*24) rgba(255,255,255,.05),
    inset calc(var(--u)*-34) 0 calc(var(--u)*46) calc(var(--u)*-28) rgba(150,155,210,.30),
    inset 0 calc(var(--u)*-24) calc(var(--u)*40) calc(var(--u)*-24) rgba(150,155,210,.10),
    0 calc(var(--u)*20) calc(var(--u)*50) rgba(0,0,20,.35)}
/* gradient glass rim: brighter along the top edge, fading down the sides */
.prompt::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(var(--u)*3);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0) 72%,rgba(255,255,255,.34) 100%),linear-gradient(180deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.30) 25%,rgba(255,255,255,.24) 70%,rgba(255,255,255,.34) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.prompt textarea{position:absolute;left:calc(var(--u)*39);right:calc(var(--u)*36);top:calc(var(--u)*36);height:calc(var(--u)*170);resize:none;background:none;border:0;outline:0;color:#fff;
  font-family:"Red Hat Display",sans-serif;font-weight:500;font-size:calc(var(--u)*23.2);line-height:1.4}
.prompt textarea::placeholder{color:#eceaf4;opacity:1}
.tools{position:absolute;left:calc(var(--u)*39);right:calc(var(--u)*26);bottom:calc(var(--u)*26);display:flex;align-items:center;gap:calc(var(--u)*17)}
.pill{display:flex;align-items:center;gap:calc(var(--u)*17);height:calc(var(--u)*58);padding:calc(var(--u)*2) 0 0 calc(var(--u)*19);border-radius:999px;
  background:linear-gradient(180deg,rgba(80,82,96,.24),rgba(72,74,90,.18));
  border:calc(var(--u)*2) solid rgba(255,255,255,.24);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.08);
  font-weight:600;font-size:calc(var(--u)*19.8);color:#f5f5fa;white-space:nowrap;transition:background .15s}
.pill:hover{background:rgba(255,255,255,.13)}
.pill svg{flex:none;width:calc(var(--u)*26);height:calc(var(--u)*26)}
.chip i,.wave,.send{flex:none}
.pill:nth-child(2){width:calc(var(--u)*138)}.pill:nth-child(3){width:calc(var(--u)*174)}
.pill.sq{width:calc(var(--u)*74);padding:0 !important;justify-content:center}
.pill.sq svg{width:calc(var(--u)*30);height:calc(var(--u)*30)}
.spacer{flex:1}
.wave{width:calc(var(--u)*25);height:calc(var(--u)*26);margin-right:calc(var(--u)*7);opacity:.92}
.send{width:calc(var(--u)*57);height:calc(var(--u)*57);border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 calc(var(--u)*4) calc(var(--u)*14) rgba(0,0,0,.25);transition:transform .15s}
.send:hover{transform:scale(1.04)}
.send svg{width:calc(var(--u)*30);height:calc(var(--u)*30)}

/* ==================================================================
   RESPONSIVE LAYERS
   Everything above this line is the desktop build and is never edited
   here; the layers below only ever ADD overrides inside media queries
   that cannot match a desktop viewport.

   Where the desktop architecture breaks (measured, not assumed):
   the split is drawn at --u = min(vw/2048, vh/1389). The smallest scale
   desktop already ships at is 0.553 (1366x768 laptop). Below a width of
   1133px the width term drops under that floor and the first element to
   fail is the chip label (~9px) followed by the form labels, so 1133px
   is where desktop hands over. From there:

   1. Tablet split   900-1132px, landscape, >=640px tall
      Same side-by-side architecture, re-flowed: its own readable scale,
      tighter vertical rhythm so it still fits one viewport, chips 2x2.
   2. Stacked        everything else up to 1132px (portrait tablets,
      short landscape phones). Two full-viewport sections, login first.
   3. Mobile         <=665px, where the stacked scale would push text
      under ~13px. Px-based type, 48-52px touch targets, 2x2 chip grid,
      a composer whose toolbar wraps by content.
   ================================================================== */

/* ---- shared by every non-desktop layer ---- */
@media (max-width: 1132px){
  body{overflow:auto}
  .screen{width:auto;min-height:0}
  .eye{width:40px;height:40px;right:calc(var(--u)*18 - 10px)}
  .eye svg{width:calc(var(--u)*19.5);height:calc(var(--u)*21)}
  .input.pw input{padding-right:48px}
  .input input{font-size:max(16px, calc(var(--u)*18.7))}
  .input.pw input:not(.shown){font-size:calc(var(--u)*32)}
}

/* ---- 1. TABLET SPLIT: landscape tablets / small laptop windows ---- */
@media (max-width: 1132px) and (min-width: 900px) and (orientation: landscape) and (min-height: 640px){
  /* starts at exactly the desktop floor (0.553 at 1132px) and grows as the
     columns get narrower, capped by what fits the column and the height */
  :root{--u: max(0.553px, min((50vw - 80px) / 606, (100dvh - 120px) / 897, calc(0.553px + (1133px - 100vw) * 0.001), 0.8px))}
  .screen{height:100dvh}
  .left{display:flex;flex-direction:column;padding:28px clamp(28px, 4vw, 44px) 24px}
  .brand{position:static}
  .form-wrap{position:static;margin:auto;width:calc(var(--u)*606);max-width:100%;padding:20px 0}
  .fields{margin-top:calc(var(--u)*56)}
  .btn-primary{margin-top:calc(var(--u)*32)}
  .divider{margin-top:calc(var(--u)*26)}
  .btn-social.g{margin-top:calc(var(--u)*28)}
  .signup{margin-top:calc(var(--u)*30)}
  .foot{position:static}

  .panel{left:50%;right:12px;top:12px;bottom:12px;border-radius:18px}
  .panel-inner{bottom:calc(var(--u)*48)}
  .ask{margin-right:0}
  .chips{margin-right:0;flex-wrap:wrap;row-gap:calc(var(--u)*14);max-width:calc(var(--u)*400)}
  .chip{height:max(calc(var(--u)*46), 34px)}
  .prompt{width:min(calc(var(--u)*886), calc(100% - 56px))}
}

/* ---- 2. STACKED: portrait tablets and short landscape screens ---- */
@media (max-width: 899px), (max-width: 1132px) and (orientation: portrait), (max-width: 1132px) and (max-height: 639px){
  :root{--u: clamp(0.62px, (100vw - 64px) / 886, 0.8px)}
  .screen{height:auto;display:flex;flex-direction:column}

  .left{position:relative;inset:auto;min-height:100svh;display:flex;flex-direction:column;
    padding:max(32px, env(safe-area-inset-top)) clamp(24px, 5vw, 48px) 28px}
  .brand{position:static}
  .form-wrap{position:static;margin:auto;width:calc(var(--u)*606);max-width:100%;padding:48px 0}
  .foot{position:static}

  .panel{position:relative;inset:auto;margin:0 12px 12px;min-height:calc(100svh - 12px);border-radius:20px;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 clamp(20px, 4vw, 32px) max(calc(var(--u)*63), env(safe-area-inset-bottom))}
  .panel-inner{position:static}
  .ask{margin-right:0}
  .chips{margin-right:0;flex-wrap:wrap;row-gap:calc(var(--u)*14)}
  .prompt{width:100%;max-width:calc(var(--u)*886)}
}

/* ---- 3. MOBILE ---- */
@media (max-width: 665px){
  :root{--u: clamp(0.62px, 100vw / 560, 0.74px);--gx: clamp(16px, 5.4vw, 28px)}

  /* login */
  .left{padding:max(20px, env(safe-area-inset-top)) var(--gx) max(20px, env(safe-area-inset-bottom))}
  .brand{gap:10px}
  .brand-mark{width:34px;height:34px;border-radius:8px}
  .brand-mark svg{width:22px;height:22px}
  .brand-name{font-size:22px;letter-spacing:-.1px}
  .form-wrap{width:100%;max-width:440px;padding:36px 0}
  .title{font-size:clamp(32px, 9.4vw, 42px);letter-spacing:-.02em}
  .subtitle{margin:10px auto 0;font-size:15px;line-height:1.45;white-space:normal;text-wrap:balance}
  .fields{margin-top:32px}
  .field + .field{margin-top:18px}
  .label{font-size:14px;margin-bottom:8px}
  .input,.input.pw{height:50px;border-width:1.5px;border-radius:10px}
  .input:focus-within{box-shadow:0 0 0 3px rgba(123,79,242,.12)}
  .input input{padding:0 14px;font-size:16px}
  .input.pw input:not(.shown){font-size:26px;letter-spacing:2.5px;padding-left:12px;padding-bottom:3px}
  .eye{right:5px}
  .eye svg{width:19px;height:20px}
  .forgot{font-size:14px;margin-top:4px;padding:6px 0}
  .btn-primary{height:52px;margin-top:20px;padding-bottom:0;border-radius:12px;font-size:17px}
  .divider{margin-top:24px;gap:14px;font-size:15px}
  .divider::before,.divider::after{height:1.5px;top:1px}
  .btn-social{height:52px;gap:10px;padding-top:0;border-width:1.5px;border-radius:10px;font-size:16px}
  .btn-social svg{width:20px;height:20px}
  .btn-social.g svg{top:0}
  .btn-social.g{margin-top:20px}
  .btn-social.a{margin-top:12px;padding-left:2px}
  .btn-social.a svg{width:18px;height:21px;top:-2px}
  .signup{margin-top:24px;font-size:15px}
  .signup a{text-decoration-thickness:1px;text-underline-offset:3px}
  .foot{font-size:14px}
  .foot span{gap:6px}
  .foot svg{width:16px;height:16px}

  /* AI panel */
  .panel{margin:0 10px 10px;min-height:calc(100svh - 10px);border-radius:18px;
    padding:0 14px max(14px, env(safe-area-inset-bottom))}
  .ask{font-size:clamp(24px, (100vw - 48px) / 10, 40px);letter-spacing:-.015em}
  .panel-inner{width:100%;max-width:520px;margin:0 auto}
  .chips{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;width:100%;margin-top:20px}
  .chips .chip{width:auto;min-width:0;height:42px;padding:0 10px 0 7px;gap:8px;border-width:1.5px;font-size:clamp(12px, 3.5vw, 14px)}
  .chip i{width:28px;height:28px}
  .chip i svg{width:15px;height:15px}
  .prompt{height:auto;margin-top:18px;border-radius:22px;display:flex;flex-direction:column;padding:16px 14px 14px}
  .prompt::before{padding:2px}
  .prompt textarea{position:static;width:100%;height:auto;min-height:92px;padding:0 2px;font-size:16px}
  .tools{position:static;margin-top:10px;flex-wrap:wrap;gap:10px 8px}
  .tools .pill{width:auto;height:42px;padding:0 14px 0 12px;gap:8px;border-width:1.5px;font-size:14px}
  .tools .pill.sq{width:42px}
  .pill svg{width:18px;height:18px}
  .pill.sq svg{width:20px;height:20px}
  .spacer{min-width:16px}
  .wave{width:18px;height:19px;margin:0 4px 0 auto}
  .send{width:42px;height:42px}
  .send svg{width:22px;height:22px}
}

/* ---- touch devices: hover styles would stick after a tap, so the same
   feedback moves to :active; mouse users keep the desktop hover ---- */
@media (hover: none){
  .chip:hover{background:linear-gradient(180deg,rgba(78,80,100,.34),rgba(66,68,88,.26));border-color:rgba(255,255,255,.24)}
  .pill:hover{background:linear-gradient(180deg,rgba(80,82,96,.24),rgba(72,74,90,.18))}
  .btn-social:hover{background:#fafafa}
  .btn-primary:hover{filter:none}
  .send:hover{transform:none}
